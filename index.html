<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كارت شخصي</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<!-- lawyer-card v1.1 : الشكل هنا، والبيانات كلها في config.js -->
<script src="config.js"></script>
<script>
(function () {
  var C = window.CONFIG || {};
  document.documentElement.setAttribute("data-theme", C.theme === "dark" ? "dark" : "sand");
  if (C.name) document.title = C.name;
})();
</script>
<style>
:root[data-theme="sand"]{--bg:#D9C9A8;--card:#E6D9BC;--gold:#8A6A1F;--tx:#1F3B2E;--mu:#4D5A47;--ph:#1F3B2E;--hl:#E3C36A;
  --b1:#1F3B2E;--t1:#F6EFE0;--b2:#2F7D4A;--t2:#FFFFFF;--b3:#8A6A1F;--t3:#FFFFFF;--b4:#4A6355;--t4:#F6EFE0}
:root[data-theme="dark"]{--bg:#05070B;--card:#0B1018;--gold:#D4AF37;--tx:#FFFFFF;--mu:#8A94A6;--ph:#4A90E2;--hl:#FFFFFF;
  --b1:#2F74B8;--t1:#FFFFFF;--b2:#178A42;--t2:#FFFFFF;--b3:#C9A22C;--t3:#1A1405;--b4:#5B6B8C;--t4:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:420px;padding:18px 16px 36px;text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;direction:ltr}
.sp{width:44px;height:44px}
.sh{width:44px;height:44px;padding:0;border-radius:12px;border:1.5px solid var(--gold);background:var(--card);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sh svg{width:22px;height:22px}
.em{width:88px;height:78px;color:var(--gold)}
h1{margin:8px 0 0;font-size:30px;font-weight:700;color:var(--gold)}
.box{border:1.5px solid var(--gold);background:var(--card);border-radius:14px;padding:16px 12px;margin:14px 0 16px}
.ttl{font-size:15px;font-weight:700;color:var(--mu);line-height:1.6}
.ph{font-size:30px;font-weight:700;color:var(--ph);direction:ltr;letter-spacing:1px;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 8px;border-radius:14px;border:2px solid transparent;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;line-height:1.4;transition:transform .12s}
.btn svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.98)}
#b1{background:var(--b1);color:var(--t1)}
#b2{background:var(--b2);color:var(--t2)}
#b3{background:var(--b3);color:var(--t3)}
#b4{background:var(--b4);color:var(--t4)}
.sh:hover,.btn:hover,.box:hover,.mb:hover,.cp:hover{border-color:var(--hl)}
.mb{display:none;margin-top:14px;border:1.5px solid var(--gold);background:var(--card);border-radius:14px;padding:14px 12px}
.mb.open{display:block}
.mt{font-size:14px;font-weight:700;color:var(--mu);margin-bottom:8px}
.mr{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
#mailtxt{direction:ltr;font-size:17px;font-weight:700;color:var(--tx);word-break:break-all;user-select:all;-webkit-user-select:all}
.cp{font-family:inherit;font-size:15px;font-weight:700;padding:8px 18px;border-radius:10px;border:2px solid var(--gold);background:var(--gold);color:var(--bg);cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <button class="sh" id="share" type="button" aria-label="مشاركة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.9l7.6-3.8M8.2 13.1l7.6 3.8"/></svg>
    </button>
    <svg class="em" viewBox="0 0 64 56" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="32" cy="5" r="2.2" fill="currentColor"/>
      <path d="M32 7v39"/>
      <path d="M10 14h44"/>
      <path d="M10 14L3.5 32M10 14L16.5 32"/>
      <path d="M54 14L47.5 32M54 14L60.5 32"/>
      <path d="M3 32h14a7 5 0 0 1-14 0z" fill="currentColor" fill-opacity=".25"/>
      <path d="M47 32h14a7 5 0 0 1-14 0z" fill="currentColor" fill-opacity=".25"/>
      <path d="M26 46h12"/>
      <path d="M21 51h22"/>
    </svg>
    <div class="sp"></div>
  </div>

  <h1 id="name"></h1>

  <div class="box">
    <div class="ttl" id="title"></div>
    <div class="ph" id="phone"></div>
  </div>

  <div class="grid" id="grid">
    <a class="btn" id="b1" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
      <span id="l1"></span>
    </a>
    <a class="btn" id="b2" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>
      <span id="l2"></span>
    </a>
    <a class="btn" id="b3" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="11" r="3"/><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1-2.827 0l-4.244-4.243a8 8 0 1 1 11.314 0z"/></svg>
      <span id="l3"></span>
    </a>
    <a class="btn" id="b4" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6l9-6"/></svg>
      <span id="l4"></span>
    </a>
  </div>

  <div class="mb" id="mailbox">
    <div class="mt" id="mailtitle"></div>
    <div class="mr">
      <span id="mailtxt"></span>
      <button class="cp" id="copybtn" type="button"></button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var C = window.CONFIG || {};
  var L = C.labels || {};
  function $(id) { return document.getElementById(id); }
  function hide(id) { $(id).style.display = "none"; }

  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("on"); }, 2000);
  }

  function copyText(text, done) {
    var ok = false;
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) { ok = false; }
    if (ok) { done(true); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else { done(false); }
  }

  $("name").textContent = C.name || "";
  $("title").textContent = C.title || "";
  $("phone").textContent = C.phoneDisplay || C.phone || "";
  $("l1").textContent = L.call || "اتصل بي";
  $("l2").textContent = L.whatsapp || "راسلني واتساب";
  $("l3").textContent = L.map || "موقع المكتب";
  $("l4").textContent = L.mail || "راسلني بالإيميل";

  var isDesktop = !!(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches);

  var tel = (C.phone || "").replace(/[^\d+]/g, "");
  if (tel) {
    $("b1").href = "tel:" + tel;
    $("b1").target = "_top";
  } else { hide("b1"); }

  var wa = (C.whatsapp || "").replace(/\D/g, "");
  function waLink() {
    var parts = [];
    if (C.whatsappAutoGreeting !== false) parts.push(new Date().getHours() < 12 ? "صباح الخير" : "مساء الخير");
    if (C.whatsappText) parts.push(C.whatsappText);
    return "https://wa.me/" + wa + (parts.length ? "?text=" + encodeURIComponent(parts.join(" ")) : "");
  }
  if (wa) {
    $("b2").href = waLink();
    $("b2").target = "_blank";
    $("b2").rel = "noopener";
    $("b2").addEventListener("click", function () { this.href = waLink(); });
  } else { hide("b2"); }

  if (C.mapUrl) {
    $("b3").href = C.mapUrl;
    $("b3").target = "_blank";
    $("b3").rel = "noopener";
  } else { hide("b3"); }

  var email = C.email || "";
  if (email) {
    var q = [];
    if (C.emailSubject) q.push("subject=" + encodeURIComponent(C.emailSubject));
    if (C.emailBody) q.push("body=" + encodeURIComponent(C.emailBody));
    var mailto = "mailto:" + email + (q.length ? "?" + q.join("&") : "");
    if (isDesktop) {
      $("mailtitle").textContent = L.mailBoxTitle || "الإيميل:";
      $("mailtxt").textContent = email;
      $("copybtn").textContent = L.copy || "نسخ";
      $("b4").addEventListener("click", function (e) {
        e.preventDefault();
        $("mailbox").classList.toggle("open");
      });
      $("copybtn").addEventListener("click", function () {
        var btn = this;
        copyText(email, function (ok) {
          if (ok) {
            btn.textContent = L.copied || "تم النسخ ✓";
            setTimeout(function () { btn.textContent = L.copy || "نسخ"; }, 2000);
          } else {
            var r = document.createRange();
            r.selectNodeContents($("mailtxt"));
            var s = window.getSelection();
            s.removeAllRanges();
            s.addRange(r);
            toast("حدد الإيميل واضغط Ctrl+C");
          }
        });
      });
    } else {
      $("b4").href = mailto;
      $("b4").target = "_top";
    }
  } else { hide("b4"); }

  var shareUrl = C.shareUrl || "";
  if (shareUrl) {
    $("share").addEventListener("click", function () {
      function fallback() {
        copyText(shareUrl, function (ok) { toast(ok ? "تم نسخ الرابط" : shareUrl); });
      }
      if (navigator.share) {
        try {
          navigator.share({ title: C.name || "", text: (C.name || "") + " - " + (C.title || ""), url: shareUrl })
            .catch(function (e) { if (!e || e.name !== "AbortError") fallback(); });
        } catch (e) { fallback(); }
      } else { fallback(); }
    });
  } else { $("share").style.visibility = "hidden"; }

  var shown = [];
  ["b1", "b2", "b3", "b4"].forEach(function (id) {
    if ($(id).style.display !== "none") shown.push($(id));
  });
  if (shown.length % 2 === 1) shown[shown.length - 1].style.gridColumn = "1 / -1";
})();
</script>
</body>
</html>
